[build]
  command = "npx prisma generate && next build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Redirección canónica permanente (301) de netlify.app hacia el dominio principal farfalina.tech
[[redirects]]
  from = "https://farfalina.netlify.app/*"
  to = "https://farfalina.tech/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://farfalina.netlify.app/*"
  to = "https://farfalina.tech/:splat"
  status = 301
  force = true

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, x-relay-client, X-Relay-Client"
